<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoL 海克斯大亂鬥全書 · Patch 16.23 | 局內選牌決策 × 傷害成長模擬 × 特化裝備攻略</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-hex">⬡</div>
        <div>
          <div class="brand-title">LoL 海克斯大亂鬥全書</div>
          <div class="brand-sub">ARAM: Mayhem · Patch <span id="patchBadge">16.23</span> · OP.GG × ARAMGG × Riot 實戰庫</div>
        </div>
      </div>

      <nav class="main-nav" id="mainNav">
        <button class="nav-btn active" data-view="champion">🎯 選牌決策與英雄配裝</button>
        <button class="nav-btn" data-view="calc">🧮 傷害與成長模擬</button>
        <button class="nav-btn" data-view="augments">✨ 海克斯反查圖鑑</button>
        <button class="nav-btn" data-view="cheatsheet">📜 機制特化速查</button>
        <button class="nav-btn" data-view="tierlist">🏆 全英雄強度榜</button>
      </nav>

      <div class="global-search-wrap">
        <input id="globalSearchInput" type="search" placeholder="快搜英雄或海克斯 (如: 凱特琳、幻影武器)..." autocomplete="off" />
        <div id="globalSearchDropdown" class="search-dropdown hidden"></div>
      </div>

      <button id="syncStatusBtn" class="sync-pill" title="檢查或立即同步最新資料">🔄 資料檢查中...</button>
    </div>
  </header>

  <main class="container">
    <!-- VIEW 1: UNIFIED PICK ADVISOR & CHAMPION BUILD EXPLORER -->
    <section id="view-champion" class="view active">
      <div class="panel picker-panel" id="champPickerPanel">
        <div class="picker-controls">
          <div class="picker-title-row">
            <h2>選擇英雄 <span class="muted-count" id="champCountLabel">(173)</span></h2>
            <div style="display:flex;gap:8px;align-items:center">
              <button id="champModalQuickBtn" class="btn-gold btn-sm">🔍 彈窗快選英雄</button>
              <button id="togglePickerBtn" class="btn-ghost btn-sm">展開全英雄網格 ▼</button>
            </div>
          </div>
          <div class="picker-filters" id="champPickerFilters">
            <input id="champSearchInput" type="search" placeholder="篩選英雄名稱 / 英文 / 稱號..." class="input-sm" />
            <div class="pill-group" id="roleFilterGroup">
              <button class="pill active" data-role="ALL">全部定位</button>
              <button class="pill" data-role="Mage">法師</button>
              <button class="pill" data-role="Fighter">戰士</button>
              <button class="pill" data-role="Assassin">刺客</button>
              <button class="pill" data-role="Marksman">射手</button>
              <button class="pill" data-role="Tank">坦克</button>
              <button class="pill" data-role="Support">輔助</button>
            </div>
            <div class="pill-group" id="tierFilterGroup">
              <button class="pill active" data-tier="ALL">全梯隊</button>
              <button class="pill tier-0" data-tier="0">T0 OP</button>
              <button class="pill tier-1" data-tier="1">T1</button>
              <button class="pill tier-2" data-tier="2">T2</button>
              <button class="pill tier-3" data-tier="3">T3</button>
              <button class="pill tier-4" data-tier="4">T4</button>
            </div>
          </div>
        </div>
        <div id="champGrid" class="champ-grid collapsed"></div>
      </div>
      <div id="champDetailContainer"></div>
    </section>

    <!-- VIEW 2: DAMAGE & GROWTH SIMULATOR -->
    <section id="view-calc" class="view"></section>

    <!-- VIEW 3: AUGMENT ENCYCLOPEDIA -->
    <section id="view-augments" class="view"></section>

    <!-- VIEW 4: MECHANICS CHEAT-SHEET -->
    <section id="view-cheatsheet" class="view"></section>

    <!-- VIEW 5: TIER LIST -->
    <section id="view-tierlist" class="view"></section>
  </main>

  <div id="floatingTooltip" class="floating-tooltip hidden"></div>

  <footer class="footer">
    <div>數據來源：OP.GG (Patch <span id="footerPatch">16.23</span> zh-tw) · ARAMGG 實戰樣本 · Riot DataDragon · Meraki 技能數值庫 <span id="footerSyncMeta"></span></div>
    <div>含全部英雄、海克斯強化符文、裝備、選牌決策台與技能傷害成長模擬器</div>
  </footer>

  <script src="./data.js"></script>
  <script src="./synergy.js"></script>
  <script src="./engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
